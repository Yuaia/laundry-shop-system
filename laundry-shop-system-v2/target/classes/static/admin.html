<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理介面 - 福興洗衣店</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap" rel="stylesheet">
  <style>body{background:#fff;font-family:"Noto Sans TC",sans-serif}.container{max-width:800px}</style>
</head>
<body>
  <div class="container mt-5">
    <h2>管理介面</h2>
    <table class="table table-bordered" id="ordersTable">
      <thead>
        <tr><th>時間</th><th>訂單編號</th><th>交貨時間</th><th>類型</th><th>類別</th><th>數量</th><th>顏色</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script>
    async function loadOrders() {
      const res = await fetch('/api/orders');
      if (!res.ok) return;
      let orders = await res.json();
      // 按 orderTime 排序(由舊到新)
      orders.sort((a,b) => new Date(a.orderTime) - new Date(b.orderTime));
      const tbody = document.querySelector('#ordersTable tbody');
      tbody.innerHTML = '';
      orders.forEach(o => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${new Date(o.orderTime).toLocaleString()}</td>
          <td>${o.orderNumber}</td>
          <td>${new Date(o.deliveryTime).toLocaleString()}</td>
          <td>${o.type}</td>
          <td>${o.category}</td>
          <td>${o.quantity}</td>
          <td>${o.color}</td>
        `;
        tbody.append(tr);
      });
    }
    loadOrders();
  </script>
</body>
</html>
