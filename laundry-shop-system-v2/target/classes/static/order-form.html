<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新增訂單 - 福興洗衣店</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap" rel="stylesheet">
  <style>
    body { background-color: #ffffff; font-family: "Noto Sans TC", sans-serif; }
    .container { max-width: 600px; }
    .navbar { border-bottom: 3px solid #7aaedb; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html">福興洗衣店</a>
    </div>
  </nav>
  <div class="container mt-5">
    <h2 class="mb-4">新增訂單</h2>
    <form method="post" action="order-form.html">
      <div class="mb-3">
        <label for="orderNumber" class="form-label">訂單編號</label>
        <input type="text" class="form-control" id="orderNumber" name="orderNumber" required>
      </div>
      <div class="mb-3">
        <label class="form-label">訂單類型</label>
        <select class="form-select" name="type">
          <option value="洗衣">送洗衣服</option>
          <option value="修改">修改衣服</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">衣物類型</label>
        <select class="form-select" name="category">
          <option>上衣</option>
          <option>下身衣物</option>
          <option>外套</option>
          <option>連身衣物</option>
          <option>內衣</option>
          <option>襪子</option>
          <option>帽子</option>
          <option>圍巾</option>
          <option>其他</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="quantity" class="form-label">數量</label>
        <input type="number" class="form-control" id="quantity" name="quantity" min="1" required>
      </div>
      <div class="mb-3">
        <label for="color" class="form-label">顏色</label>
        <input type="text" class="form-control" id="color" name="color" required>
      </div>
      <div class="mb-3">
        <label for="photo" class="form-label">上傳衣物照片</label>
        <input type="file" class="form-control" id="photo" name="photo">
      </div>
      <button type="submit" class="btn btn-primary w-100">送出訂單</button>
      <div class="mt-3 text-center">
        <a href="index.html">取消</a>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
