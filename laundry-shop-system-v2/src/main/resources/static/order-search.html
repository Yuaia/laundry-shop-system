<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>訂單查詢 - 福興洗衣店</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2>訂單查詢</h2>
    <form method="get" action="/api/orders">
      <div class="mb-3">
        <label for="orderId" class="form-label">訂單號碼</label>
        <input type="text" class="form-control" id="orderId" name="id" required>
      </div>
      <button type="submit" class="btn btn-success">查詢</button>
      <a href="index.html" class="btn btn-link">取消</a>
    </form>
  </div>
</body>
</html>
