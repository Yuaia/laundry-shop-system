<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>訂單查詢</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap" rel="stylesheet">
</head><body>
<div class="container mt-5"><h2>訂單查詢</h2>
<form id="lookupForm" class="mb-3"><div class="mb-3"><label class="form-label">訂單號碼</label><input type="text" id="orderId" class="form-control" required></div><button type="submit" class="btn btn-success">查詢</button></form>
<div id="orderResult"></div>
<script>
document.getElementById('lookupForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const res=await fetch('/api/orders/'+e.target.orderId.value);
 if(res.ok){const json=await res.json();document.getElementById('orderResult').innerHTML='<pre>'+JSON.stringify(json,null,2)+'</pre>';}else alert('查無此訂單');
});
</script>
</div>
</body></html>
