<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>加入會員 - 福興洗衣店</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap" rel="stylesheet">
  <style>
    body { background-color: #ffffff; font-family: "Noto Sans TC", sans-serif; }
    .container { max-width: 500px; }
    .navbar { border-bottom: 3px solid #7aaedb; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html">福興洗衣店</a>
    </div>
  </nav>
  <div class="container mt-5">
    <h2 class="mb-4">加入會員</h2>
    <form method="post" action="signup.html">
      <div class="mb-3">
        <label for="newUsername" class="form-label">帳號</label>
        <input type="text" class="form-control" id="newUsername" name="username" required>
      </div>
      <div class="mb-3">
        <label for="newPassword" class="form-label">密碼</label>
        <input type="password" class="form-control" id="newPassword" name="password" required>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">手機號碼</label>
        <input type="tel" class="form-control" id="phone" name="phone" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">電子郵件</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <button type="submit" class="btn btn-success w-100">送出</button>
      <div class="mt-3 text-center">
        已有帳號？<a href="login.html">登入</a>
      </div>
      <div class="mt-1 text-center">
        <a href="index.html">回首頁</a>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
