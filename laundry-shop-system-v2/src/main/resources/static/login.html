<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>會員登入 - 福興洗衣店</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #ffffff;
      font-family: "Noto Sans TC", sans-serif;
    }
    .container {
      max-width: 400px;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light mb-4" style="border-bottom:3px solid #7aaedb;">
    <div class="container">
      <a class="navbar-brand" href="index.html">福興洗衣店</a>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="mb-4">會員登入</h2>

    <!-- 如果有錯誤訊息，Spring 會以 flashAttribute 傳入 -->
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
    <div th:if="${message}" class="alert alert-success" role="alert" th:text="${message}"></div>

    <form method="post" action="login.html">
      <div class="mb-3">
        <label for="username" class="form-label">帳號</label>
        <input type="text" class="form-control" id="username" name="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">密碼</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">登入</button>
      <div class="mt-3 text-center">
        尚未註冊？<a href="signup.html">加入會員</a>
      </div>
      <div class="mt-1 text-center">
        <a href="index.html">回首頁</a>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
