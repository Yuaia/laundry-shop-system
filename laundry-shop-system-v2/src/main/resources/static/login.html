<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>會員登入</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap" rel="stylesheet">
<style>body{font-family:"Noto Sans TC",sans-serif}.container{max-width:400px}</style>
</head><body>
<div class="container mt-5">
<h2>會員登入</h2>
<form id="loginForm">
 <div class="mb-3"><label class="form-label">帳號</label><input type="text" id="username" name="username" class="form-control" required></div>
 <div class="mb-3"><label class="form-label">密碼</label><input type="password" id="password" name="password" class="form-control" required></div>
 <button type="submit" class="btn btn-primary w-100">登入</button>
</form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async e=>{
 e.preventDefault();
 const res = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:e.target.username.value,password:e.target.password.value})});
 if(res.ok){window.location.href='index.html'}else{alert('登入失敗')}
});
</script>
</body></html>
