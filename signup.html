<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>加入會員 - 福興洗衣店</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap" rel="stylesheet">
  <style>body{background:#fff;font-family:"Noto Sans TC",sans-serif}.container{max-width:500px}</style>
</head>
<body>
  <div class="container mt-5">
    <h2>加入會員</h2>
    <form id="signupForm">
      <div class="mb-3"><label class="form-label">帳號</label><input type="text" id="newUsername" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">密碼</label><input type="password" id="newPassword" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">手機號碼</label><input type="tel" id="phone" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">電子郵件</label><input type="email" id="email" class="form-control" required></div>
      <button type="submit" class="btn btn-success w-100">送出</button>
    </form>
  </div>
  <script>
    document.getElementById('signupForm').addEventListener('submit', async e => {
      e.preventDefault();
      const data = {
        name: document.getElementById('newUsername').value,
        phone: document.getElementById('newPassword').value, // 暫存密碼
        email: document.getElementById('email').value
      };
      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (res.ok) {
        window.location.href = 'index.html';
      } else {
        alert('註冊失敗');
      }
    });
  </script>
</body>
</html>
